<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Pomodoro Timer</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="stitch/design-tokens.css" rel="stylesheet"/>
    <link href="styles.css" rel="stylesheet"/>
</head>
<body>
    <main class="container">
        <header>
            <h1>Pomodoro Timer</h1>
        </header>
        
        <!-- Phase Indicator -->
        <div class="phase-indicator">
            <span id="phase-badge" class="phase-badge work">WORK</span>
        </div>
        
        <!-- Timer Display with Progress Ring -->
        <div class="timer-wrapper">
            <div class="progress-container">
                <svg class="progress-ring" viewBox="0 0 120 120">
                    <circle class="progress-ring-bg" cx="60" cy="60" r="54"></circle>
                    <circle id="progress-circle" class="progress-ring-circle" cx="60" cy="60" r="54"></circle>
                </svg>
                <div class="timer-display">
                    <div id="timer" class="timer" aria-live="polite">25:00</div>
                    <p id="session-info" class="session-info">Session 1 of 4</p>
                </div>
            </div>
        </div>
        
        <!-- Controls -->
        <div class="controls">
            <button id="start-btn" type="button" class="btn btn-primary">START</button>
            <button id="reset-btn" type="button" class="btn btn-secondary">RESET</button>
        </div>
    </main>
    
    <script src="timer.js"></script>
</body>
</html>
